{% extends 'base.html' %}
{% block content %}
<div class="p-3">
  <div class="container">
    <h2>{{ template_data.title }}</h2>
    <hr />
    {% include 'manage_nav.html' %}
    <div class="alert alert-warning">
      Are you sure you want to delete {{ template_data.object_label }}? This cannot be undone.
    </div>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Delete</button>
      <a class="btn btn-outline-secondary" href="{% url template_data.cancel_url %}">Cancel</a>
    </form>
  </div>
</div>
{% endblock content %}
